name: Automated ML Pipeline
on:
 push:
  branches: ["main"]
 pull_request:
  branches: ["main"]
jobs:
 run-preprocessing:
  runs-on: ubuntu-latest 
  steps:
   #1. Checkout Repository code
   - name: Checkout Code
     uses: actions/checkout@v4
   #2.Set up Python environment 
   - name: Set Up Python
     uses: action/set-python@v5
     with: 
      python-version: "3.10"
      cache: 'pip'
   #3.Install project dependencies
   - name: Install Dependencies
     run: |
       python -m pip install --upgrade pip
       pip install pandas 
       scikit-learn pytest
   #4. Run your preprocessing or test script
   - name: Run preprocessing & Tests
     run: |
      python preprocessing.py
   #Optional: Run pytest if you wrote unit tests for your data transforms
   #pytests/
